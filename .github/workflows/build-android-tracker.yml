name: Build Android YouTube Tracker
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-youtube-tracker/**'
      - '.github/workflows/build-android-tracker.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-youtube-tracker
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: reconstruct-youtube-tracker-debug-apk
          path: android-youtube-tracker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
